[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qquant"
version = "0.1.0"
description = "Quantum Quant: high-throughput quantum-classical benchmarking for NVDA quantitative research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kashvi Silswal" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pennylane>=0.38",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
ui = ["streamlit>=1.45", "altair>=5"]
dev = ["pytest>=8"]
all = ["yfinance>=0.2.40", "streamlit>=1.45", "altair>=5", "pytest>=8"]

[project.scripts]
qquant = "qquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
